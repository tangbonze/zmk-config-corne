# DYA Studio 固件构建矩阵
#
# 由 `west zmk-build` 驱动（来自 cormoran/zmk-west-commands）
# 注意：artifact 字段名是 `artifact`，不是官方工作流的 `artifact-name`
#
# 每个左手变体都必须带 `corne-central` snippet，每个右手变体都必须带
# `corne-peripheral` snippet —— DYA Studio 的全部 Kconfig 都在这两个 snippet 里
# （ZMK Studio、OS 识别、默认层、各扩展模块）。漏掉的话固件照样能编过，
# 但 Studio 整个协议栈不会被链接进去，表现为"编译通过、刷进去却连不上"。
#
---
include:
  # ================= OLED 版本 =================
  - board: nice_nano//zmk
    shield: corne_left
    snippets: [corne-oled, corne-central, studio-rpc-usb-uart]
    artifact: corne_left_oled
  - board: nice_nano//zmk
    shield: corne_right
    snippets: [corne-oled, corne-peripheral]
    artifact: corne_right_oled

  # ================= nice!view 版本 =================
  # corne-no-display 用于禁用板载 OLED（否则 SSD1306 驱动照样编译进固件；
  # nice_view.overlay 已把 zephyr,display 指向 nice_view）
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    snippets: [corne-no-display, corne-central, studio-rpc-usb-uart]
    artifact: corne_left_niceview
  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view
    snippets: [corne-no-display, corne-peripheral]
    artifact: corne_right_niceview

  # ================= 设置重置固件 =================
  # 刷这个可以把 DYA Studio 里改坏的设置恢复默认
  - board: nice_nano//zmk
    shield: settings_reset
    artifact: settings_reset
