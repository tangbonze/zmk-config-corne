# Corne 通用配置（左手 / 右手、所有显示变体共用）
#
# ⚠️ 本文件对两半同时生效（ZMK 按 corne_left / corne_right 共同应用，
#   用户 config 优先级最高）。因此这里只放**两半都需要**的配置；
#   Studio / RPC / OS 识别等 central（左手）专属配置放在
#   boards/shields/corne/Kconfig.defconfig 的 SHIELD_CORNE_LEFT 分支
#   （该文件经 Kconfig osource 加载，defaults 方式生效）。
#
# ⚠️ 不要在这里设置 CONFIG_ZMK_SPLIT_ROLE_CENTRAL：它会对两半同时生效，
#   导致右手也变 central、分体失效。
#
# ⚠️ 不要在这里设置任何 *_STUDIO_RPC 或 ZMK_STUDIO：外设半边没有
#   ZMK_STUDIO_RPC（protobuf 不生成），强开会因缺 custom.pb.h 编译失败。
#
# 显示（OLED / nice!view）由 build.yaml 的 snippet 选择，此处不开启
# CONFIG_ZMK_DISPLAY。

# 蓝牙设备名（<=16 字节；写在用户 conf 里可确定性地覆盖 defconfig 默认值）
CONFIG_ZMK_KEYBOARD_NAME="Corne DYA"

# 蓝牙发射功率 +8dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#
# 电池
#
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
# 分体：主控代理由外设半边读取电量（central-only，右手自动忽略）
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#
# 蓝牙配置档数量
#
# 可用配置档 +1（+1 留给 peripheral；右手侧仅多占少量 RAM，无功能影响）
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

#
# 电源管理（DYA Studio 可在网页上实时调整，经 settings RPC 下发）
#
CONFIG_ZMK_SLEEP=y
# 30s
CONFIG_ZMK_IDLE_TIMEOUT=30000
# 30min
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

#
# cormoran/zmk fork 提供的设置项
#
# 半双工 UART（有线连接分体）
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
# 分体间事件中继：设置变更从主控同步到外设半边
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# Zephyr 4.x 默认开启 CONSOLE，此处关闭以省 flash
CONFIG_CONSOLE=n

# 设备设置（电源管理等核心 setting 的读写；右手只做接收/应用）
# https://github.com/cormoran/zmk-module-settings-rpc
CONFIG_ZMK_SETTINGS_RPC=y

# 自定义设置：把普通 Zephyr setting 暴露到设置同步链路
# https://github.com/cormoran/zmk-feature-custom-settings
CONFIG_ZMK_CUSTOM_SETTINGS=y
# 分体：把设置变更中继到外设半边 / 从主控中继接收并应用
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

#
# 资源与协议调整
#

# 缩短设置落盘防抖，减少编辑设置后丢数据的风险
# 注意：会增加 flash 写入频率
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# 线程栈（两半共用；Studio RPC 专属的缓冲/栈在 Kconfig.defconfig 左手分支）
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
